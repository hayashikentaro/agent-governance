version: 1

# Capability profiles define what an agent can read, write, execute, and escalate.
# They are not suggestions. They are the contract used by checkers and guards.

verdicts:
  PASS: Allowed.
  BLOCK: Must be fixed before review.
  SPLIT: Must be split into smaller tasks or PRs.
  HUMAN_DECISION: Requires explicit human approval.

capability_profiles:
  ui_patch:
    description: Patch UI inside one granted domain.
    read:
      - "{domain}/**"
      - packages/core/src/domains/**/types/**
    write:
      - "{domain}/ui/**"
      - "{domain}/tests/**"
    execute:
      - pnpm lint
      - pnpm test
    denied:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
      - apps/server/**
    escalation:
      outside_write_scope: HUMAN_DECISION
      dependency_change: HUMAN_DECISION
      shared_change: HUMAN_DECISION

  domain_logic_patch:
    description: Patch logic inside one granted domain.
    read:
      - "{domain}/**"
      - packages/core/**
    write:
      - "{domain}/logic/**"
      - "{domain}/model/**"
      - "{domain}/tests/**"
    execute:
      - pnpm lint
      - pnpm test
      - pnpm typecheck
    denied:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
    escalation:
      outside_write_scope: HUMAN_DECISION
      dependency_change: HUMAN_DECISION
      shared_change: HUMAN_DECISION

  docs_only:
    description: Documentation-only work.
    read:
      - "**/*"
    write:
      - README.md
      - docs/**
    execute: []
    denied:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
      - apps/**
      - packages/**
    escalation:
      code_change: BLOCK

  junction_integration:
    description: Coordinate a small named junction across multiple domains when the cross-domain relationship itself has business meaning.
    requires_human_approval: true
    max_domains: 3
    max_changed_files: 8
    max_changed_lines: 400
    write:
      - "src/junctions/{junction}/**"
      - "src/tests/junctions/{junction}.test.*"
      - "docs/junctions/{junction}.md"
    readonly:
      - src/core/**
      - src/domains/**
      - src/adapters/**
      - src/runtime/**
    required_declaration:
      - junction_name
      - participating_domains
      - participating_effects
      - coordination_semantics
      - execution_order
      - failure_semantics
      - compensation_or_retry_policy
      - acceptance_criteria
      - rollback_plan
    escalation:
      unnamed_cross_domain_work: BLOCK
      outside_junction_boundary: HUMAN_DECISION
      dependency_change: HUMAN_DECISION
      shared_change: HUMAN_DECISION

  vertical_slice:
    description: Explicitly approved cross-domain feature work.
    requires_human_approval: true
    max_domains: 3
    max_changed_files: 8
    max_changed_lines: 400
    required_declaration:
      - affected_domains
      - reason
      - acceptance_criteria
      - rollback_plan
      - split_plan
    escalation:
      undeclared_domain: BLOCK
      dependency_change: HUMAN_DECISION
      shared_change: HUMAN_DECISION
