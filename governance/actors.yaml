version: 1

# Actors are not personalities or human job titles.
# They are safe capability presets for real work.

actors:
  docs_writer:
    description: Documentation-only work.
    capability_profile: docs_only
    default_domain: docs
    write:
      - README.md
      - docs/**
    denied:
      - apps/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
    escalation:
      code_change: BLOCK

  ui_patcher:
    description: Small UI-only changes inside one granted domain.
    capability_profile: ui_patch
    requires_domain: true
    write:
      - "{domain}/ui/**"
      - "{domain}/tests/**"
    denied:
      - apps/server/**
      - packages/core/**
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
    escalation:
      outside_domain: HUMAN_DECISION
      shared_change: HUMAN_DECISION
      dependency_change: HUMAN_DECISION

  domain_logic_patcher:
    description: Logic/model changes inside one granted domain.
    capability_profile: domain_logic_patch
    requires_domain: true
    write:
      - "{domain}/logic/**"
      - "{domain}/model/**"
      - "{domain}/tests/**"
    denied:
      - apps/**/src/shared/**
      - packages/shared/**
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
    escalation:
      outside_domain: HUMAN_DECISION
      shared_change: HUMAN_DECISION
      dependency_change: HUMAN_DECISION

  governance_editor:
    description: Edit governance definitions, generation scripts, and checker logic.
    capability_profile: governance_patch
    write:
      - governance/**
      - scripts/**
      - package.json
    escalation:
      dependency_change: HUMAN_DECISION
      workflow_change: HUMAN_DECISION

  junction_integrator:
    description: Coordinate a small named junction across multiple domains when the cross-domain relationship itself has business meaning.
    capability_profile: junction_integration
    requires_human_approval: true
    write:
      - "src/junctions/{junction}/**"
      - "src/tests/junctions/{junction}.test.*"
      - "docs/junctions/{junction}.md"
    readonly:
      - src/core/**
      - src/domains/**
      - src/adapters/**
      - src/runtime/**
    limits:
      max_domains: 3
      max_changed_files: 8
      max_changed_lines: 400
    required_declaration:
      - junction_name
      - participating_domains
      - participating_effects
      - coordination_semantics
      - execution_order
      - failure_semantics
      - compensation_or_retry_policy
      - acceptance_criteria
      - rollback_plan
    forbidden_mix:
      - feature_change + unrelated_refactor
      - dependency_change + junction_change
      - formatting_cleanup + behavior_change
    escalation:
      unnamed_cross_domain_work: BLOCK
      outside_junction_boundary: HUMAN_DECISION
      shared_change: HUMAN_DECISION
      dependency_change: HUMAN_DECISION

  vertical_slice_worker:
    description: Cross-domain feature work with explicit human approval.
    capability_profile: vertical_slice
    requires_human_approval: true
    required_declaration:
      - affected_domains
      - reason
      - rollback_plan
    escalation:
      undeclared_domain: BLOCK
      shared_change: HUMAN_DECISION
      dependency_change: HUMAN_DECISION
