version: 1

principles:
  - id: capability_not_obedience
    title: Govern agents by capability, not by obedience.
    description: Do not ask agents to behave. Constrain what they can read, write, execute, and escalate.

  - id: layer_boundaries_by_default
    title: Keep layer boundaries by default.
    description: Horizontal layer boundaries are the default editing boundary because they limit implementation responsibility without introducing ambiguous product-boundary choices.

  - id: named_junction_for_side_effect_crossings
    title: Use small named junctions for side-effect crossings.
    description: Junctions are for unavoidable crossings where side effects meet and the coordination itself has meaning. They are controlled exceptions, not a general architecture style.

  - id: prefer_local_duplication_over_premature_shared_abstraction
    title: Prefer local duplication over premature shared abstraction.
    description: Boilerplate is acceptable when it preserves capability boundaries. Shared abstractions are privileged because they widen future change scope.

  - id: verdicts_for_structure_scores_for_suspicion
    title: Use verdicts for structural violations and scores for semantic suspicion.
    description: Deterministic policy violations should produce verdicts. Heuristic smells should produce suspicion scores that route work to semantic review.

verdicts:
  PASS: Allowed.
  BLOCK: Must be fixed before review.
  SPLIT: Must be split into smaller tasks or PRs.
  HUMAN_DECISION: Requires explicit human approval.

suspicion_levels:
  LOW:
    min_score: 0
    max_score: 29
    action: PASS_FAST
  MEDIUM:
    min_score: 30
    max_score: 59
    action: WARN_ONLY
  NEEDS_SEMANTIC_REVIEW:
    min_score: 60
    max_score: 79
    action: ROUTE_TO_HEAVY_REVIEWER
  HIGH:
    min_score: 80
    max_score: 100
    action: HUMAN_DECISION

rules:
  - id: one_primary_layer_boundary
    title: One task, one primary layer boundary unless it is a named junction.
    agent_guidance: Keep non-junction work inside one granted layer such as ui, app-flow, protocol, runtime, model, persistence, or docs.
    type: layer_count
    max_layers: 1
    on_violation: SPLIT
    exceptions:
      - junction_integration
      - vertical_slice
      - api_contract_update

  - id: one_primary_domain
    title: One task, one primary domain.
    agent_guidance: Keep the task inside its granted primary domain.
    type: domain_count
    max_domains: 1
    on_violation: SPLIT
    exceptions:
      - vertical_slice
      - api_contract_update
      - junction_integration

  - id: granted_write_scope_only
    title: Write only inside granted paths.
    agent_guidance: Do not edit outside the write paths granted by your task contract.
    type: write_scope
    on_violation: BLOCK

  - id: import_boundaries_are_structural
    title: Import boundaries are structural policy, not semantic review.
    agent_guidance: Import direction is checked by classification tables and allowed dependency rules. Do not ask an LLM to decide import legality.
    type: import_boundary
    source: governance/import-boundaries.yaml
    on_violation: BLOCK

  - id: suspicious_patterns_route_semantic_review
    title: Suspicious patterns route work to semantic review.
    agent_guidance: Suspicion scores are not guilt. They are deterministic smell signals used to decide whether heavier review is worth the cost.
    type: suspicion_score
    source: governance/suspicious-patterns.yaml
    on_threshold:
      NEEDS_SEMANTIC_REVIEW: HUMAN_DECISION
      HIGH: HUMAN_DECISION

  - id: shared_requires_approval
    title: Shared changes require approval.
    agent_guidance: Do not edit shared code without explicit approval. Prefer local duplication when the alternative is premature shared abstraction.
    type: protected_domain
    domains:
      - shared
    on_violation: HUMAN_DECISION

  - id: dependency_requires_approval
    title: Dependency changes require approval.
    agent_guidance: Do not add, remove, or modify dependencies without explicit approval.
    type: path_match
    paths:
      - package.json
      - pnpm-lock.yaml
      - package-lock.json
    on_change: HUMAN_DECISION

  - id: generated_files_readonly
    title: Generated files are read-only.
    agent_guidance: Do not edit generated files unless explicitly granted.
    type: path_match
    paths:
      - '**/generated/**'
      - TODO.md
      - CONTEXT.md
      - THREADS.md
    on_change: BLOCK

  - id: side_effect_crossing_requires_named_junction
    title: Side-effect crossings require a named junction.
    agent_guidance: If side effects meet and their ordering, failure semantics, retry, compensation, or observability matter, use a small named junction instead of widening a general actor.
    type: declaration_required
    required_when: side_effect_crossing_has_coordination_semantics
    required_declaration:
      - junction_name
      - participating_effects
      - coordination_semantics
      - execution_order
      - failure_semantics
      - retry_or_compensation_policy
      - acceptance_criteria
      - rollback_plan
    on_violation: HUMAN_DECISION

  - id: junction_is_controlled_exception
    title: A junction is a controlled exception.
    agent_guidance: Do not use junction work as a reason to edit unrelated layers, domains, or shared abstractions. Keep the junction as the smallest named crossing that explains the coordination.
    type: declaration_required
    required_when: junction_integration
    required_declaration:
      - junction_name
      - participating_layers
      - smallest_boundary
      - explicitly_out_of_scope
    on_violation: HUMAN_DECISION

  - id: escalate_when_scope_is_insufficient
    title: Request escalation instead of expanding scope.
    agent_guidance: If the task cannot be completed inside scope, request escalation instead of editing wider.
    type: escalation_required
    on_violation: HUMAN_DECISION
